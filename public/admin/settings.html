<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan Kurs &amp; Studio — UMROH LENS Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  .settings-grid {

    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 24px;
    margin-top: 20px;
  }
  .settings-card {
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 4px 14px rgba(28, 24, 20, 0.04);
  }
  .settings-card h3 {
    font-size: 1.15rem;
    margin-top: 0;
    margin-bottom: 16px;
    color: var(--charcoal);
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--charcoal-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;

  .toast-success {
    background: #DCE8D0;

    border: 1px solid #C0D8AC;
  }
  .file-btn {
    display: inline-block;
    padding: 6px 12px;
    font-size: 0.76rem;
    background: var(--ivory);

  }
</style>

<body class="admin">

<script>renderAdminNav('settings');</script>

<script>
function compressImage(file, maxWidth = 800, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

async function loadSettings() {
  const main = document.getElementById('admin-main');
  main.innerHTML = `<h1 class="admin-h1">Pengaturan Kurs &amp; Studio</h1><p class="admin-sub">Memuat konfigurasi...</p>`;

  try {
    const [setRes, photoRes] = await Promise.all([
      adminFetch('/api/admin/settings'),
      adminFetch('/api/admin/photographer').catch(() => null)
    ]);
    const data = setRes.ok ? await setRes.json() : {};
    const photographer = (photoRes && photoRes.ok) ? await photoRes.json() : {};

    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
        <div>
          <h1 class="admin-h1" style="margin-bottom:4px;">Pengaturan Kurs &amp; Studio</h1>
          <p class="admin-sub" style="margin-top:0;">Kelola nilai tukar mata uang (SAR → IDR), kontak WhatsApp, nomor rekening resmi studio, dan notifikasi Telegram.</p>
        </div>
        <button onclick="saveAllSettings()" class="btn btn-primary" style="padding:10px 24px; font-weight:600; display:flex; align-items:center; gap:8px;">
          <span>💾 Simpan Semua Pengaturan</span>
        </button>
      </div>

      <div id="toast" class="toast-alert toast-success">
        ✅ Pengaturan berhasil disimpan dan disinkronkan ke Supabase!
      </div>

      <div class="settings-grid">
        <!-- 1. Kurs & Buffer Settings -->
        <div class="settings-card">
          <h3>💱 Kurs Mata Uang &amp; Sesi</h3>
          
          <div class="form-group">
            <label>Nilai Tukar Kurs (1 SAR = ... Rupiah IDR)</label>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:700; color:var(--gold);">1 SAR = Rp</span>
              <input type="number" id="idr_sar_rate" value="${data.idr_sar_rate || 4200}" style="font-size:1.1rem; font-weight:700; color:var(--charcoal);">
            </div>
            <small style="color:var(--charcoal-soft); font-size:0.76rem; display:block; margin-top:4px;">
              Digunakan saat perhitungan invoice, konversi rupiah di rate card, dan checkout DP.
            </small>
          </div>

          <div class="form-group">
            <label>Jeda Waktu Antar Sesi (Buffer Minutes)</label>
            <input type="number" id="buffer_minutes" value="${data.buffer_minutes || 30}">
            <small style="color:var(--charcoal-soft); font-size:0.76rem; display:block; margin-top:4px;">
              Waktu istirahat/perjalanan fotografer sebelum sesi berikutnya (dalam menit).
            </small>
          </div>

          <div class="form-group">
            <label>Default Google Drive Master Folder URL</label>
            <input type="url" id="default_drive_url" value="${data.default_drive_url || 'https://drive.google.com'}" placeholder="https://drive.google.com/drive/folders/...">
            <small style="color:var(--charcoal-soft); font-size:0.76rem; display:block; margin-top:4px;">
              Link folder Google Drive umum jika klien belum memiliki link folder khusus.
            </small>
          </div>
        </div>

        <!-- 2. WhatsApp Admin Contacts -->
        <div class="settings-card">
          <h3>📱 Kontak WhatsApp &amp; Media Sosial</h3>
          
          <div class="form-group">
            <label>Nomor WhatsApp Utama (Admin 1 / CS)</label>
            <input type="text" id="admin_whatsapp" value="${data.admin_whatsapp || '+6282175272547'}">
            <small style="color:var(--charcoal-soft); font-size:0.76rem; display:block; margin-top:4px;">
              Nomor yang menerima pesan booking otomatis dari website &amp; Rate Card.
            </small>
          </div>

          <div class="form-group">
            <label>Nomor WhatsApp Cadangan (Admin 2 / Madinah)</label>
            <input type="text" id="admin_whatsapp_2" value="${data.admin_whatsapp_2 || '+6281234567890'}">
          </div>

          <div class="form-group">
            <label>Instagram Official URL</label>
            <input type="text" id="instagram_url" value="${data.instagram_url || 'https://instagram.com/umrohlens'}">
          </div>

          <div class="form-group">
            <label>Instagram Handle</label>
            <input type="text" id="instagram_handle" value="${data.instagram_handle || '@umrohlens'}">
          </div>
        </div>

        <!-- 3. Saudi Bank Account (SAR) -->
        <div class="settings-card">
          <h3>🇸🇦 Rekening Bank Saudi (SAR)</h3>
          
          <div class="form-group">
            <label>Nama Bank Saudi</label>
            <input type="text" id="bank_sar_name" value="${data.bank_sar_name || 'Al Rajhi Bank (Saudi Arabia)'}">
          </div>

          <div class="form-group">
            <label>Nomor Rekening / IBAN</label>
            <input type="text" id="bank_sar_account" value="${data.bank_sar_account || 'SA84 8000 0123 4567 8901 2345'}">
          </div>

          <div class="form-group">
            <label>Atas Nama (Account Holder)</label>
            <input type="text" id="bank_sar_holder" value="${data.bank_sar_holder || 'UMROH LENS Photography Studio'}">
          </div>
        </div>

        <!-- 4. Indonesian Bank Account (IDR) -->
        <div class="settings-card">
          <h3>🇮🇩 Rekening Bank Indonesia (Rupiah)</h3>
          
          <div class="form-group">
            <label>Nama Bank Indonesia (BCA / BSI / Mandiri)</label>
            <input type="text" id="bank_idr_name" value="${data.bank_idr_name || 'Bank Central Asia (BCA) / BSI'}">
          </div>

          <div class="form-group">
            <label>Nomor Rekening</label>
            <input type="text" id="bank_idr_account" value="${data.bank_idr_account || '5420123456 (BCA)'}">
          </div>

          <div class="form-group">
            <label>Atas Nama (Account Holder)</label>
            <input type="text" id="bank_idr_holder" value="${data.bank_idr_holder || 'WAHYU AFRIANSYAH'}">
          </div>
        </div>

        <!-- 5. Photographer & Studio Profile -->
        <div class="settings-card" style="grid-column: 1 / -1; border-left: 4px solid var(--gold);">
          <h3>📷 Profil Studio &amp; Fotografer Utama</h3>
          
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label>Nama Studio / Fotografer</label>
              <input type="text" id="photographer_name" value="${photographer.name || data.photographer_name || 'UMROH LENS'}">
            </div>

            <div class="form-group">
              <label>Foto Profil / Avatar</label>
              <input type="text" id="photographer_avatar" value="${photographer.avatar_url || data.photographer_avatar || '/img/photographer-1.jpg'}">
              <input type="file" id="p-avatar-file" accept="image/*" style="display:none;" onchange="handlePhotographerAvatar(this)">
              <button type="button" class="file-btn" onclick="document.getElementById('p-avatar-file').click()">📁 Upload Foto dari Perangkat</button>
            </div>
          </div>

          <div class="form-group">
            <label>Bio &amp; Deskripsi Fotografer</label>
            <textarea id="photographer_bio" rows="2">${photographer.bio || data.photographer_bio || 'Fotografer & videografer profesional berbasis di Madinah Al-Munawwarah.'}</textarea>
          </div>
        </div>

        <!-- 6. Telegram Bot Real-time Alerts & Interactive Commands -->
        <div class="settings-card" style="grid-column: 1 / -1; border-left: 4px solid #0088cc;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
            <h3 style="margin:0; display:flex; align-items:center; gap:8px;">
              <span>✈️</span> Notifikasi &amp; Asisten Interaktif Telegram Bot
            </h3>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" onclick="activateTelegramWebhook()" class="btn" style="background:#28a745; color:#fff; font-size:0.78rem; padding:6px 14px; border-radius:4px; border:none; cursor:pointer; font-weight:600;">
                ⚡ Aktifkan Respon Chat Interaktif (2-Arah)
              </button>
              <button type="button" onclick="testTelegramAlert()" class="btn" style="background:#0088cc; color:#fff; font-size:0.78rem; padding:6px 14px; border-radius:4px; border:none; cursor:pointer; font-weight:600;">
                🧪 Test Kirim Notifikasi Telegram
              </button>
            </div>
          </div>
          <p style="color:var(--charcoal-soft); font-size:0.86rem; margin-top:0; margin-bottom:14px;">
            Bot Telegram Anda berfungsi sebagai <strong>Asisten Pribadi</strong>: menerima notifikasi booking instan dan merespon pertanyaan Anda (misal ketik <code>/today</code> untuk cek jadwal hari ini, <code>/total</code> untuk rekap omset, <code>/pending</code> untuk cek transfer, dll.).
          </p>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label>Telegram Bot Token (dari @BotFather)</label>
              <input type="text" id="telegram_bot_token" value="${data.telegram_bot_token || ''}" placeholder="Contoh: 7123456789:AAHk...">
              <small style="color:var(--charcoal-soft); font-size:0.75rem; display:block; margin-top:4px;">
                Dapatkan token gratis dengan membuat bot di Telegram via <a href="https://t.me/BotFather" target="_blank" style="color:#0088cc;">@BotFather</a>.
              </small>
            </div>

            <div class="form-group">
              <label>Telegram Chat ID (Akun Anda / Grup)</label>
              <input type="text" id="telegram_chat_id" value="${data.telegram_chat_id || ''}" placeholder="Contoh: 123456789 atau -100123456789">
              <small style="color:var(--charcoal-soft); font-size:0.75rem; display:block; margin-top:4px;">
                Cek Chat ID Anda dengan mengirim pesan ke <a href="https://t.me/userinfobot" target="_blank" style="color:#0088cc;">@userinfobot</a>.
              </small>
            </div>
          </div>
          
          <div id="telegram-test-result" style="display:none; margin-top:12px; padding:10px 14px; border-radius:4px; font-size:0.84rem;"></div>
        </div>

      </div>
    `;
  } catch (err) {
    main.innerHTML = `<div class="error-msg">Gagal memuat pengaturan: ${err.message}</div>`;
  }
}

async function handlePhotographerAvatar(input) {
  if (input.files && input.files[0]) {
    const dataUrl = await compressImage(input.files[0], 600);
    document.getElementById('photographer_avatar').value = dataUrl;
    alert('Foto profil dipilih dari perangkat. Klik "💾 Simpan Semua Pengaturan" untuk menerapkan.');
  }
}

async function saveAllSettings() {
  const payload = {
    idr_sar_rate: document.getElementById('idr_sar_rate').value,
    buffer_minutes: document.getElementById('buffer_minutes').value,
    default_drive_url: document.getElementById('default_drive_url').value,
    telegram_bot_token: document.getElementById('telegram_bot_token').value,
    telegram_chat_id: document.getElementById('telegram_chat_id').value,
    admin_whatsapp: document.getElementById('admin_whatsapp').value,
    admin_whatsapp_2: document.getElementById('admin_whatsapp_2').value,
    instagram_handle: document.getElementById('instagram_handle').value,
    instagram_url: document.getElementById('instagram_url').value,
    bank_sar_name: document.getElementById('bank_sar_name').value,
    bank_sar_account: document.getElementById('bank_sar_account').value,
    bank_sar_holder: document.getElementById('bank_sar_holder').value,
    bank_idr_name: document.getElementById('bank_idr_name').value,
    bank_idr_account: document.getElementById('bank_idr_account').value,
    bank_idr_holder: document.getElementById('bank_idr_holder').value,
    photographer_name: document.getElementById('photographer_name').value,
    photographer_avatar: document.getElementById('photographer_avatar').value,
    photographer_bio: document.getElementById('photographer_bio').value
  };

  try {
    // 1. Save settings
    const res = await adminFetch('/api/admin/settings', {
      method: 'PUT',
      body: JSON.stringify(payload)
    });

    // 2. Also save photographer row
    await adminFetch('/api/admin/photographer', {
      method: 'PUT',
      body: JSON.stringify({
        name: payload.photographer_name,
        avatar_url: payload.photographer_avatar,
        bio: payload.photographer_bio
      })
    }).catch(() => {});

    if (res.ok) {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    } else {
      const err = await res.json();
      alert('Gagal menyimpan: ' + (err.error || 'Terjadi kesalahan'));
    }
  } catch (e) {
    alert('Gagal menyimpan: ' + e.message);
  }
}

async function testTelegramAlert() {
  const bot_token = document.getElementById('telegram_bot_token').value.trim();
  const chat_id = document.getElementById('telegram_chat_id').value.trim();
  const resBox = document.getElementById('telegram-test-result');

  if (!bot_token || !chat_id) {
    resBox.style.display = 'block';
    resBox.style.background = '#FFF3CD';
    resBox.style.color = '#856404';
    resBox.style.border = '1px solid #FFEEBA';
    resBox.innerHTML = '⚠️ Silakan isi <strong>Telegram Bot Token</strong> dan <strong>Telegram Chat ID</strong> terlebih dahulu.';
    return;
  }

  resBox.style.display = 'block';
  resBox.style.background = '#E8F0FE';
  resBox.style.color = '#1A73E8';
  resBox.style.border = '1px solid #C2D7FA';
  resBox.textContent = 'Mengirim pesan tes ke Telegram...';

  try {
    const res = await adminFetch('/api/admin/test-telegram', {
      method: 'POST',
      body: JSON.stringify({ bot_token, chat_id })
    });
    const data = await res.json();

    if (res.ok) {
      resBox.style.background = '#DCE8D0';
      resBox.style.color = '#2E5B1A';
      resBox.style.border = '1px solid #C0D8AC';
      resBox.innerHTML = '✅ <strong>Berhasil!</strong> Pesan tes telah masuk ke Telegram Anda. Jangan lupa klik <strong>"💾 Simpan Semua Pengaturan"</strong> di atas.';
    } else {
      resBox.style.background = '#F8D7DA';
      resBox.style.color = '#721C24';
      resBox.style.border = '1px solid #F5C6CB';
      resBox.innerHTML = '❌ <strong>Gagal:</strong> ' + (data.error || 'Periksa kembali Bot Token dan Chat ID Anda.');
    }
  } catch (err) {
    resBox.style.background = '#F8D7DA';
    resBox.style.color = '#721C24';
    resBox.style.border = '1px solid #F5C6CB';
    resBox.innerHTML = '❌ Terjadi kesalahan: ' + err.message;
  }
}

async function activateTelegramWebhook() {
  const bot_token = document.getElementById('telegram_bot_token').value.trim();
  const resBox = document.getElementById('telegram-test-result');

  if (!bot_token) {
    alert('Silakan isi Telegram Bot Token terlebih dahulu.');
    return;
  }

  resBox.style.display = 'block';
  resBox.style.background = '#E8F0FE';
  resBox.style.color = '#1A73E8';
  resBox.style.border = '1px solid #C2D7FA';
  resBox.textContent = 'Mendaftarkan Webhook Telegram...';

  try {
    const origin = window.location.origin;
    const webhook_url = `${origin}/api/telegram/webhook`;
    const res = await adminFetch('/api/admin/set-telegram-webhook', {
      method: 'POST',
      body: JSON.stringify({ bot_token, webhook_url })
    });
    const data = await res.json();

    if (res.ok) {
      resBox.style.background = '#DCE8D0';
      resBox.style.color = '#2E5B1A';
      resBox.style.border = '1px solid #C0D8AC';
      resBox.innerHTML = `✅ <strong>Bot Interaktif Aktif!</strong> Webhook tersambung ke <code>${webhook_url}</code>.<br>Sekarang Anda bisa kirim chat ke bot seperti <code>/today</code>, <code>/total</code>, atau <code>"hari ini saya ada jadwal apa"</code>.`;
    } else {
      resBox.style.background = '#F8D7DA';
      resBox.style.color = '#721C24';
      resBox.style.border = '1px solid #F5C6CB';
      resBox.innerHTML = '❌ <strong>Gagal mendaftarkan:</strong> ' + (data.error || 'Terjadi kesalahan');
    }
  } catch (err) {
    resBox.style.background = '#F8D7DA';
    resBox.style.color = '#721C24';
    resBox.style.border = '1px solid #F5C6CB';
    resBox.innerHTML = '❌ Error: ' + err.message;
  }
}

document.addEventListener('DOMContentLoaded', loadSettings);
</script>
