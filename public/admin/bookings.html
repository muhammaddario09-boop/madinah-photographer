<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — UMROH LENS Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
<script src="/js/admin-nav.js"></script>
<script>renderAdminNav('bookings');</script>
<script>
const STATUSES = ['PENDING','AWAITING_PAYMENT','CONFIRMED','RESCHEDULE_REQUESTED','COMPLETED','CANCELLED','NO_SHOW'];
async function loadBookings(status) {
  try {
    const url = status ? `/api/admin/bookings?status=${status}` : '/api/admin/bookings';
    const res = await adminFetch(url);
    const data = res.ok ? await res.json() : [];
    return Array.isArray(data) ? data : [];
  } catch(e) {
    return [];
  }
}
async function draw(status) {
  const main = document.getElementById('admin-main');
  main.innerHTML = `<h1 class="admin-h1">Bookings</h1><p class="admin-sub">Loading reservations...</p>`;
  const bookings = await loadBookings(status);
  main.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
      <h1 class="admin-h1" style="margin-bottom:0;">Bookings</h1>
      <button onclick="resetAllDemoBookings()" class="btn" style="background:#dc3545; color:#fff; font-size:0.75rem; padding:6px 14px; border-radius:4px; border:none; cursor:pointer; font-weight:500;">
        🧹 Reset Data Demo (Mulai dari 0)
      </button>
    </div>
    <p class="admin-sub" style="margin-top:-6px; margin-bottom:16px;">${bookings.length} booking(s) registered</p>
    <div class="admin-toolbar" style="margin-bottom:18px;">
      <select id="status-filter">
        <option value="">All statuses</option>
        ${STATUSES.map(s => `<option value="${s}" ${s===status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
      </select>
    </div>
    <table class="admin-table">
      <thead><tr><th>Booking</th><th>Date</th><th>Client</th><th>Service</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${bookings.length === 0 ? '<tr><td colspan="7" style="text-align:center; padding:32px; color:var(--charcoal-soft);">Belum ada data booking. Database bersih (0 bookings).</td></tr>' : ''}
        ${bookings.map(b => `
          <tr>
            <td><strong>${b.booking_code}</strong></td>
            <td>${b.date}<br><span style="color:var(--charcoal-soft); font-size:0.78rem;">${b.start_time} - ${b.end_time}</span></td>
            <td>${b.client_name}<br><span style="color:var(--charcoal-soft); font-size:0.78rem;">${b.client_phone}</span></td>
            <td>${b.service_name}</td>
            <td>
              <div>${b.currency} ${b.deposit_amount} <span style="font-size:0.72rem; color:var(--charcoal-soft);">(Deposit)</span></div>
              ${b.proof_url ? `<button type="button" onclick="showProof('${b.booking_code}', '${encodeURIComponent(b.proof_url)}')" style="margin-top:4px; padding:3px 8px; font-size:0.7rem; background:#DCE8D0; color:#3E5B2A; border:1px solid #c0d8ac; border-radius:2px; cursor:pointer;">📸 View Proof</button>` : '<span style="font-size:0.72rem; color:var(--charcoal-soft);">No proof</span>'}
            </td>
            <td><span class="status-tag status-${b.status}">${b.status.replace('_',' ')}</span></td>
            <td style="white-space:nowrap;">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <a href="/invoice.html?code=${b.booking_code}" target="_blank" title="Cetak Kuitansi Resmi" style="background:var(--ivory); color:var(--charcoal); border:1px solid var(--line); padding:4px 8px; font-size:0.75rem; border-radius:3px; text-decoration:none;">🧾 Invoice</a>
                <a href="/gallery.html?code=${b.booking_code}" target="_blank" title="Buka Galeri Klien" style="background:#EBF5EC; color:#155724; border:1px solid #C3E6CB; padding:4px 8px; font-size:0.75rem; border-radius:3px; text-decoration:none;">📸 Galeri</a>
                <select data-id="${b.id}" data-current="${b.status}" class="status-select" style="font-size:0.8rem; padding:4px 6px;">
                  <option value="">Status…</option>
                  ${STATUSES.map(s => `<option value="${s}">${s.replace('_',' ')}</option>`).join('')}
                </select>
                <button onclick="deleteSingleBooking('${b.id}', '${b.booking_code}')" title="Hapus Booking" style="background:#fff0f0; color:#c82333; border:1px solid #f5c6cb; padding:4px 8px; font-size:0.75rem; border-radius:3px; cursor:pointer;">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <!-- Modal for Payment Proof Preview -->
    <div id="proof-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
      <div style="background:#fff; padding:24px; border-radius:6px; max-width:500px; width:90%; max-height:85vh; overflow-y:auto; text-align:center; position:relative;">
        <h3 id="modal-title" style="margin-bottom:14px; font-family:var(--font-display);">Payment Proof</h3>
        <img id="modal-img" style="max-width:100%; max-height:60vh; border-radius:4px; border:1px solid var(--line); object-fit:contain;">
        <div style="margin-top:16px;">
          <button class="btn btn-ghost" onclick="document.getElementById('proof-modal').style.display='none'">Close Preview</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('status-filter')?.addEventListener('change', (e) => draw(e.target.value));
  document.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async (e) => {
      if (!e.target.value) return;
      const res = await adminFetch(`/api/admin/bookings/${e.target.dataset.id}/status`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ status: e.target.value }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error); }
      draw(status);
    });
  });
}

async function deleteSingleBooking(id, code) {
  if (!confirm(`Apakah Anda yakin ingin menghapus booking ${code}? Data pembayaran dan riwayat booking ini akan dihapus permanen.`)) return;
  try {
    const res = await adminFetch(`/api/admin/bookings/${id}`, { method: 'DELETE' });
    if (res.ok) {
      draw();
    } else {
      const d = await res.json();
      alert(d.error || 'Gagal menghapus booking');
    }
  } catch (e) {
    alert('Gagal menghapus: ' + e.message);
  }
}

async function resetAllDemoBookings() {
  if (!confirm('PERINGATAN: Apakah Anda yakin ingin MENGHAPUS SEMUA data booking demo dan memulai dari 0?\n\nSemua riwayat booking & tes akan dibersihkan.')) return;
  try {
    const res = await adminFetch('/api/admin/bookings/reset-all', { method: 'POST' });
    if (res.ok) {
      alert('Semua data booking demo berhasil dibersihkan! Anda sekarang mulai dari 0 booking.');
      draw();
    } else {
      const d = await res.json();
      alert(d.error || 'Gagal mereset booking.');
    }
  } catch(e) {
    alert('Gagal mereset: ' + e.message);
  }
}

function showProof(code, encodedUrl) {
  const modal = document.getElementById('proof-modal');
  document.getElementById('modal-title').textContent = `Payment Proof — ${code}`;
  document.getElementById('modal-img').src = decodeURIComponent(encodedUrl);
  modal.style.display = 'flex';
}

draw();
</script>
</body>
</html>
