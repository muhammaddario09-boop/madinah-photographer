<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5F5F7">
<title>Bookings &amp; Reservasi — UMROH LENS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
<script src="/js/admin-nav.js"></script>
<script>renderAdminNav('bookings');</script>
<script src="/js/escape-html.js"></script>
<script>
const STATUSES = ['PENDING','AWAITING_PAYMENT','CONFIRMED','RESCHEDULE_REQUESTED','COMPLETED','CANCELLED','NO_SHOW'];
const PAY_STATUSES = [
  ['UNPAID', '⏳ Belum Bayar (UNPAID)'],
  ['DEPOSIT_PAID', '✅ DP Terbayar (DEPOSIT_PAID)'],
  ['PAID', '💰 Lunas (PAID)'],
  ['REFUNDED', '↩️ Refund (REFUNDED)']
];

async function loadBookings(status) {
  try {
    const url = status ? `/api/admin/bookings?status=${status}` : '/api/admin/bookings';
    const res = await adminFetch(url);
    const data = res.ok ? await res.json() : [];
    return Array.isArray(data) ? data : [];
  } catch(e) {
    return [];
  }
}

async function draw(status) {
  const main = document.getElementById('admin-main');
  main.innerHTML = `<h1 class="admin-h1">Bookings</h1><p class="admin-sub">Memuat daftar reservasi…</p>`;
  const bookings = await loadBookings(status);

  main.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
      <div>
        <h1 class="admin-h1" style="margin-bottom:4px;">Kelola Bookings &amp; Pembayaran</h1>
        <p class="admin-sub" style="margin-top:0;">${bookings.length} reservasi terdaftar di sistem</p>
      </div>
      <button onclick="resetAllDemoBookings()" class="btn" style="background:#dc3545; color:#fff; font-size:0.75rem; padding:6px 14px; border-radius:4px; border:none; cursor:pointer; font-weight:500;">
        🧹 Reset Data Demo (Mulai dari 0)
      </button>
    </div>

    <div class="admin-toolbar" style="margin-bottom:18px; display:flex; gap:12px; align-items:center;">
      <select id="status-filter">
        <option value="">Semua Status Sesi</option>
        ${STATUSES.map(s => `<option value="${s}" ${s===status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
      </select>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Kode Booking</th>
          <th>Tanggal &amp; Waktu</th>
          <th>Data Jemaah</th>
          <th>Layanan</th>
          <th>Status Pembayaran</th>
          <th>Google Drive Hasil Foto</th>
          <th>Status Sesi</th>
          <th>Aksi Cepat</th>
        </tr>
      </thead>
      <tbody>
        ${bookings.length === 0 ? '<tr><td colspan="8" style="text-align:center; padding:32px; color:var(--charcoal-soft);">Belum ada data booking.</td></tr>' : ''}
        ${bookings.map(b => {
          const payBg = b.payment_status === 'PAID' ? '#DCE8D0' : (b.payment_status === 'DEPOSIT_PAID' ? '#EBF5EC' : '#FFF3CD');
          const payColor = b.payment_status === 'PAID' ? '#2E5B1A' : (b.payment_status === 'DEPOSIT_PAID' ? '#155724' : '#856404');
          const safeCode = escapeHtml(b.booking_code);
          const driveHref = safeUrl(b.drive_url, '');
          return `
            <tr>
              <td>
                <strong style="color:var(--charcoal);">${safeCode}</strong>
                ${b.created_at ? `<div style="font-size:0.72rem; color:var(--charcoal-soft);">${new Date(b.created_at).toLocaleDateString('id-ID')}</div>` : ''}
              </td>
              <td>
                <strong>${b.date}</strong><br>
                <span style="color:var(--charcoal-soft); font-size:0.78rem;">${b.start_time} - ${b.end_time}</span>
              </td>
              <td>
                <strong>${escapeHtml(b.client_name)}</strong><br>
                <a href="https://wa.me/${(b.client_phone||'').replace(/[^0-9]/g,'')}" target="_blank" style="color:var(--gold); font-size:0.78rem; text-decoration:none;">
                  📱 ${escapeHtml(b.client_phone)}
                </a>
              </td>
              <td>
                <strong>${escapeHtml(b.service_name || 'Madinah Photo')}</strong>
                <div style="font-size:0.74rem; color:var(--charcoal-soft);">${escapeHtml(b.package_name || '')}</div>
              </td>
              <td>
                <div style="margin-bottom:4px; font-weight:600; font-size:0.85rem;">
                  ${b.currency} ${b.deposit_amount} <span style="font-size:0.72rem; font-weight:normal; color:var(--charcoal-soft);">(DP)</span>
                </div>
                <select data-id="${b.id}" class="pay-status-select" style="font-size:0.74rem; padding:4px 6px; border-radius:4px; font-weight:600; background:${payBg}; color:${payColor}; border:1px solid rgba(0,0,0,0.1); cursor:pointer;">
                  ${PAY_STATUSES.map(([pval, plabel]) => `
                    <option value="${pval}" ${b.payment_status === pval ? 'selected' : ''}>${plabel}</option>
                  `).join('')}
                </select>
                ${b.proof_url ? `
                  <div style="margin-top:4px;">
                    <button type="button" onclick="showProof(${escapeHtml(JSON.stringify(b.booking_code))}, '${encodeURIComponent(b.proof_url)}')" style="padding:2px 6px; font-size:0.68rem; background:#DCE8D0; color:#3E5B2A; border:1px solid #c0d8ac; border-radius:2px; cursor:pointer;">
                      📸 Lihat Bukti Transfer
                    </button>
                  </div>
                ` : ''}
              </td>
              <td>
                ${b.drive_url ? `
                  <div style="margin-bottom:6px;">
                    <span style="display:inline-block; padding:2px 6px; background:#DCE8D0; color:#2E5B1A; font-size:0.68rem; font-weight:700; border-radius:3px; margin-bottom:4px;">
                      ✅ Tersambung
                    </span><br>
                    <a href="${driveHref}" target="_blank" rel="noopener" style="color:#1a73e8; font-size:0.75rem; text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:4px;">
                      🔗 Buka Folder Drive ↗
                    </a>
                  </div>
                  <button onclick="openDriveModal(${JSON.stringify(b.id)}, ${escapeHtml(JSON.stringify(b.booking_code))}, ${escapeHtml(JSON.stringify(b.client_name))}, '${encodeURIComponent(b.drive_url || '')}')" class="btn" style="background:#f1f3f4; color:#3c4043; border:1px solid #dadce0; padding:2px 6px; font-size:0.7rem; border-radius:3px; cursor:pointer;">
                    ✏️ Edit Link
                  </button>
                ` : `
                  <div style="margin-bottom:6px;">
                    <span style="font-size:0.72rem; color:#d93025; font-weight:600; display:block;">
                      ⏳ Belum diinput
                    </span>
                  </div>
                  <button onclick="openDriveModal(${JSON.stringify(b.id)}, ${escapeHtml(JSON.stringify(b.booking_code))}, ${escapeHtml(JSON.stringify(b.client_name))}, '')" class="btn" style="background:#e8f0fe; color:#1a73e8; border:1px solid #c2d7fa; padding:3px 8px; font-size:0.72rem; border-radius:3px; cursor:pointer; font-weight:600;">
                    ➕ Input Link Drive
                  </button>
                `}
              </td>
              <td>
                <span class="status-tag status-${b.status}">${b.status.replace('_',' ')}</span>
              </td>
              <td style="white-space:nowrap;">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <a href="/invoice.html?code=${b.booking_code}" target="_blank" title="Cetak Kuitansi Resmi" style="background:var(--ivory); color:var(--charcoal); border:1px solid var(--line); padding:4px 8px; font-size:0.75rem; border-radius:3px; text-decoration:none;">
                    🧾 Invoice
                  </a>
                  <a href="/gallery.html?code=${b.booking_code}" target="_blank" title="Buka Galeri Klien" style="background:#EBF5EC; color:#155724; border:1px solid #C3E6CB; padding:4px 8px; font-size:0.75rem; border-radius:3px; text-decoration:none;">
                    📸 Galeri
                  </a>
                  <select data-id="${b.id}" data-current="${b.status}" class="status-select" style="font-size:0.76rem; padding:4px 6px;">
                    <option value="">Status…</option>
                    ${STATUSES.map(s => `<option value="${s}">${s.replace('_',' ')}</option>`).join('')}
                  </select>
                  <button onclick="deleteSingleBooking(${JSON.stringify(b.id)}, ${escapeHtml(JSON.stringify(b.booking_code))})" title="Hapus Booking" aria-label="Hapus booking ${escapeHtml(b.booking_code)}" style="background:#fff0f0; color:#c82333; border:1px solid #f5c6cb; padding:4px 8px; font-size:0.75rem; border-radius:3px; cursor:pointer;">
                    🗑️
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>

    <!-- Modal for Google Drive Link Manager -->
    <div id="drive-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
      <div style="background:#fff; padding:28px; border-radius:8px; max-width:520px; width:92%; box-shadow:0 16px 48px rgba(0,0,0,0.2); overscroll-behavior:contain;">
        <h3 style="margin-top:0; margin-bottom:6px; font-family:var(--font-display); font-size:1.3rem;">
          📁 Atur Link Google Drive Hasil Foto
        </h3>
        <p style="color:var(--charcoal-soft); font-size:0.86rem; margin-top:0; margin-bottom:18px;" id="drive-modal-subtitle">
          Masukkan URL folder Google Drive untuk jemaah ini:
        </p>

        <div style="margin-bottom:18px;">
          <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--charcoal-soft); margin-bottom:6px; text-transform:uppercase;">
            URL Folder Google Drive (Original RAW / Edited)
          </label>
          <input type="url" id="drive-url-input" placeholder="https://drive.google.com/drive/folders/…" style="width:100%; box-sizing:border-box; padding:12px; border:1px solid var(--line); border-radius:4px; font-size:0.92rem;">
          <small style="color:var(--charcoal-soft); font-size:0.75rem; display:block; margin-top:4px;">
            Link ini akan terbuka saat jemaah mengklik tombol "Download Folder Google Drive" di halaman Galeri Foto Klien.
          </small>
        </div>

        <input type="hidden" id="drive-booking-id">

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
          <button class="btn btn-ghost" onclick="closeDriveModal()">Batal</button>
          <button class="btn btn-primary" onclick="saveDriveUrl()" style="background:#1a73e8; border-color:#1a73e8; padding:10px 20px;">
            💾 Simpan Link Drive
          </button>
        </div>
      </div>
    </div>

    <!-- Modal for Payment Proof Preview -->
    <div id="proof-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
      <div style="background:#fff; padding:24px; border-radius:6px; max-width:500px; width:90%; max-height:85vh; overflow-y:auto; text-align:center; position:relative; overscroll-behavior:contain;">
        <h3 id="modal-title" style="margin-bottom:14px; font-family:var(--font-display);">Bukti Pembayaran</h3>
        <img id="modal-img" style="max-width:100%; max-height:60vh; border-radius:4px; border:1px solid var(--line); object-fit:contain;">
        <div style="margin-top:16px;">
          <button id="proof-close-btn" class="btn btn-ghost" onclick="document.getElementById('proof-modal').style.display='none'">Tutup Preview</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('status-filter')?.addEventListener('change', (e) => draw(e.target.value));

  // Change Session Status
  document.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async (e) => {
      if (!e.target.value) return;
      const res = await adminFetch(`/api/admin/bookings/${e.target.dataset.id}/status`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ status: e.target.value }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error); }
      draw(status);
    });
  });

  // Change Payment Status (Verify Payment)
  document.querySelectorAll('.pay-status-select').forEach(sel => {
    sel.addEventListener('change', async (e) => {
      const newPayStatus = e.target.value;
      const res = await adminFetch(`/api/admin/bookings/${e.target.dataset.id}/status`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ payment_status: newPayStatus }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Gagal mengubah status pembayaran'); }
      draw(status);
    });
  });
}

function openDriveModal(id, code, clientName, encodedUrl) {
  window._modalReturnFocus = document.activeElement;
  document.getElementById('drive-booking-id').value = id;
  document.getElementById('drive-modal-subtitle').textContent = `Jemaah: ${clientName} (Booking ID: ${code})`;
  document.getElementById('drive-url-input').value = decodeURIComponent(encodedUrl || '');
  document.getElementById('drive-modal').style.display = 'flex';
  document.getElementById('drive-url-input').focus();
}

function closeDriveModal() {
  document.getElementById('drive-modal').style.display = 'none';
  if (window._modalReturnFocus && document.contains(window._modalReturnFocus)) {
    window._modalReturnFocus.focus();
  }
}

// Close any open modal on Escape
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  ['drive-modal', 'proof-modal'].forEach(id => {
    const m = document.getElementById(id);
    if (m && m.style.display === 'flex') {
      m.style.display = 'none';
      if (window._modalReturnFocus && document.contains(window._modalReturnFocus)) {
        window._modalReturnFocus.focus();
      }
    }
  });
});

async function saveDriveUrl() {
  const id = document.getElementById('drive-booking-id').value;
  const drive_url = document.getElementById('drive-url-input').value;

  try {
    const res = await adminFetch(`/api/admin/bookings/${id}/drive`, {
      method: 'POST',
      body: JSON.stringify({ drive_url })
    });

    if (res.ok) {
      closeDriveModal();
      draw();
    } else {
      const d = await res.json();
      alert('Gagal menyimpan: ' + (d.error || 'Terjadi kesalahan'));
    }
  } catch (err) {
    alert('Terjadi kesalahan: ' + err.message);
  }
}

async function deleteSingleBooking(id, code) {
  if (!confirm(`Apakah Anda yakin ingin menghapus booking ${code}? Data pembayaran dan riwayat booking ini akan dihapus permanen.`)) return;
  try {
    const res = await adminFetch(`/api/admin/bookings/${id}`, { method: 'DELETE' });
    if (res.ok) {
      draw();
    } else {
      const d = await res.json();
      alert(d.error || 'Gagal menghapus booking');
    }
  } catch (err) {
    alert('Terjadi kesalahan: ' + err.message);
  }
}

async function resetAllDemoBookings() {
  const confirmed = confirm('PERINGATAN: Apakah Anda yakin ingin MENGHAPUS SEMUA DATA BOOKING DEMO? Semua jadwal sesi dan riwayat pembayaran demo akan direset bersih.');
  if (!confirmed) return;

  try {
    const res = await adminFetch('/api/admin/bookings/reset-all', { method: 'POST' });
    if (res.ok) {
      alert('Semua data booking demo berhasil dibersihkan! Database sekarang bersih (0 bookings).');
      draw();
    } else {
      const d = await res.json();
      alert('Gagal mereset: ' + (d.error || 'Terjadi kesalahan'));
    }
  } catch (err) {
    alert('Terjadi kesalahan: ' + err.message);
  }
}

function showProof(code, proofUrl) {
  window._modalReturnFocus = document.activeElement;
  const modal = document.getElementById('proof-modal');
  const title = document.getElementById('modal-title');
  const img = document.getElementById('modal-img');
  title.textContent = `Bukti Transfer Booking: ${code}`;
  img.src = decodeURIComponent(proofUrl);
  modal.style.display = 'flex';
  document.getElementById('proof-close-btn').focus();
}

document.addEventListener('DOMContentLoaded', () => draw());
</script>
</body>
</html>
