<script>
function showToast(msg = 'Perubahan berhasil disimpan!') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2800);
}

function compressImage(file, maxWidth = 1200, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

// Cover image upload handlers
async function handleServiceCover(input, svcId) {
  if (input.files && input.files[0]) {
    const dataUrl = await compressImage(input.files[0], 1200);
    const card = document.querySelector(`.service-card[data-service-id="${svcId}"]`);
    card.querySelector('.svc-cover').value = dataUrl;
    card.querySelector('.svc-preview').style.backgroundImage = `url('${dataUrl}')`;
    showToast('Foto cover dipilih!');
  }
}

async function handleNewServiceCover(input) {
  if (input.files && input.files[0]) {
    const dataUrl = await compressImage(input.files[0], 1200);
    document.getElementById('new-svc-cover').value = dataUrl;
    showToast('Foto cover layanan berhasil diupload!');
  }
}

// Service Actions
async function saveService(id) {
  const card = document.querySelector(`.service-card[data-service-id="${id}"]`);
  const name = card.querySelector('.svc-name').value.trim();
  const description = card.querySelector('.svc-desc').value.trim();
  const duration_minutes = Number(card.querySelector('.svc-duration').value) || 60;
  const edited_photos = Number(card.querySelector('.svc-photos').value) || 10;
  const cover_image = card.querySelector('.svc-cover').value.trim();
  const starting_price = Number(card.querySelector('.svc-start-price').value) || 350;

  if (!name) {
    alert('Nama layanan wajib diisi.');
    return;
  }

  const res = await adminFetch(`/api/admin/services/${id}`, {
    method: 'PUT',
    body: JSON.stringify({ name, description, duration_minutes, edited_photos, cover_image, starting_price })
  });

  if (res.ok) {
    showToast(`Layanan "${name}" berhasil diperbarui!`);
  } else {
    const err = await res.json();
    alert('Gagal menyimpan: ' + (err.error || 'Terjadi kesalahan'));
  }
}

function openAddServiceModal() {
  document.getElementById('add-service-modal').style.display = 'flex';
  document.getElementById('new-svc-name').focus();
}

function closeAddServiceModal() {
  document.getElementById('add-service-modal').style.display = 'none';
}

async function submitNewService() {
  const name = document.getElementById('new-svc-name').value.trim();
  const slug = document.getElementById('new-svc-slug').value.trim();
  const description = document.getElementById('new-svc-desc').value.trim();
  const cover_image = document.getElementById('new-svc-cover').value.trim();
  const starting_price = Number(document.getElementById('new-svc-price').value) || 350;
  const duration_minutes = Number(document.getElementById('new-svc-dur').value) || 60;
  const edited_photos = Number(document.getElementById('new-svc-photos').value) || 10;
  const sort_order = Number(document.getElementById('new-svc-sort').value) || 0;

  if (!name) {
    alert('Nama layanan wajib diisi.');
    return;
  }

  try {
    const res = await adminFetch('/api/admin/services', {
      method: 'POST',
      body: JSON.stringify({ name, slug, description, cover_image, starting_price, duration_minutes, edited_photos, sort_order })
    });

    if (res.ok) {
      closeAddServiceModal();
      showToast(`Layanan "${name}" berhasil ditambahkan!`);
      loadCatalog();
    } else {
      const d = await res.json();
      alert('Gagal menambahkan layanan: ' + (d.error || 'Terjadi kesalahan'));
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function deleteService(id, name) {
  if (!confirm(`Apakah Anda yakin ingin MENGHAPUS layanan "${name}" beserta seluruh paket harga di dalamnya?`)) return;
  
  try {
    const res = await adminFetch(`/api/admin/services/${id}`, { method: 'DELETE' });
    if (res.ok) {
      showToast(`Layanan "${name}" berhasil dihapus.`);
      loadCatalog();
    } else {
      const d = await res.json();
      alert('Gagal menghapus: ' + (d.error || 'Terjadi kesalahan'));
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// Package Actions
function openAddPackageModal(serviceId, serviceName) {
  document.getElementById('new-pkg-svcid').value = serviceId;
  document.getElementById('add-pkg-subtitle').textContent = `Layanan: ${serviceName}`;
  document.getElementById('add-pkg-modal').style.display = 'flex';
  document.getElementById('new-pkg-name').focus();
}

function closeAddPackageModal() {
  document.getElementById('add-pkg-modal').style.display = 'none';
}

async function submitNewPackage() {
  const service_id = document.getElementById('new-pkg-svcid').value;
  const name = document.getElementById('new-pkg-name').value.trim();
  const price = Number(document.getElementById('new-pkg-price').value) || 0;
  const duration_minutes = Number(document.getElementById('new-pkg-dur').value) || 60;
  const edited_photos = Number(document.getElementById('new-pkg-photos').value) || 10;
  const deposit_percentage = Number(document.getElementById('new-pkg-deposit').value) || 30;
  const description = document.getElementById('new-pkg-desc').value.trim();

  if (!name || !price) {
    alert('Nama paket dan harga wajib diisi.');
    return;
  }

  try {
    const res = await adminFetch('/api/admin/packages', {
      method: 'POST',
      body: JSON.stringify({ service_id, name, price, duration_minutes, edited_photos, deposit_percentage, description })
    });

    if (res.ok) {
      closeAddPackageModal();
      showToast(`Paket "${name}" berhasil ditambahkan!`);
      loadCatalog();
    } else {
      const d = await res.json();
      alert('Gagal menambahkan paket: ' + (d.error || 'Terjadi kesalahan'));
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function savePackage(id) {
  const card = document.querySelector(`.pkg-card[data-pkg-id="${id}"]`);
  const name = card.querySelector('.pkg-name').value.trim();
  const price = Number(card.querySelector('.pkg-price').value) || 0;
  const duration_minutes = Number(card.querySelector('.pkg-duration').value) || 60;
  const edited_photos = Number(card.querySelector('.pkg-photos').value) || 10;
  const deposit_percentage = Number(card.querySelector('.pkg-deposit').value) || 30;
  const description = card.querySelector('.pkg-desc').value.trim();

  const res = await adminFetch(`/api/admin/packages/${id}`, {
    method: 'PUT',
    body: JSON.stringify({ name, price, duration_minutes, edited_photos, deposit_percentage, description })
  });

  if (res.ok) {
    showToast(`Paket "${name}" berhasil diupdate!`);
  } else {
    const d = await res.json();
    alert('Gagal mengupdate paket: ' + (d.error || 'Terjadi kesalahan'));
  }
}

async function deletePackage(id, name) {
  if (!confirm(`Apakah Anda yakin ingin menghapus paket "${name}"?`)) return;

  try {
    const res = await adminFetch(`/api/admin/packages/${id}`, { method: 'DELETE' });
    if (res.ok) {
      showToast(`Paket "${name}" berhasil dihapus.`);
      loadCatalog();
    } else {
      const d = await res.json();
      alert('Gagal menghapus paket: ' + (d.error || 'Terjadi kesalahan'));
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', loadCatalog);
</script>
